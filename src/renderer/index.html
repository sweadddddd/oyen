<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The renderer is served from a file:// URL (dev loadFile + packaged
         asar). Chromium's 'self' does NOT match the opaque file: origin, so the
         file: scheme must be listed explicitly or the external <script> tags are
         blocked and nothing renders. No remote schemes = still no network. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:;" />
    <title>Oyen</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Full-window effects layer (steam, paper roll, purr lines, z's). -->
    <canvas id="fx"></canvas>
    <!-- The cat itself: a small pixel canvas CSS-scaled + pixelated. -->
    <canvas id="sprite"></canvas>
    <!-- Speech bubbles / countdown. -->
    <div id="bubbles"></div>

    <script src="sprite.js"></script>
    <script src="stateMachine.js"></script>
    <script src="particles.js"></script>
    <script src="speechBubble.js"></script>
    <script src="sound.js"></script>
    <script src="reminders.js"></script>
    <script src="behaviors.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
