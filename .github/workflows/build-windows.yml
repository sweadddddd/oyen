name: Build Windows portable

# Produces the standalone portable .exe on a real Windows runner (native modules
# uiohook-napi / active-win are rebuilt for Electron there).
#
# - Push a version tag (e.g. v1.0.0) -> builds AND publishes the .exe to a
#   GitHub Release (permanent download URL).
# - "Run workflow" (workflow_dispatch) -> builds and uploads the .exe as a
#   downloadable workflow artifact (available once this workflow is on the
#   repo's default branch).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build portable .exe
        run: npm run build

      - name: List build output
        shell: bash
        run: ls -la dist

      - name: Upload portable .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: OyenDesktopPet-portable
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
