name: Build Windows portable

# Produces the standalone portable .exe on a real Windows runner (native modules
# uiohook-napi / active-win are rebuilt for Electron there).
#
# Triggers:
# - Push a version tag (e.g. v1.0.0) -> builds AND publishes the .exe to a
#   GitHub Release (permanent download URL).
# - "Run workflow" (workflow_dispatch) -> builds the .exe, uploads it as a
#   workflow artifact, and (by default) also publishes a Release for the given
#   tag using GITHUB_TOKEN (which can create tags from inside CI).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      publish_release:
        description: "Publish a GitHub Release with the .exe"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build portable .exe
        run: npm run build

      - name: List build output
        shell: bash
        run: ls -la dist

      - name: Upload portable .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: OyenDesktopPet-portable
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
